name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: mkdir -p data && pnpm db:push
        env:
          DATABASE_URL: file:./data/fintrack.db
      - run: pnpm build
        env:
          DATABASE_URL: file:./data/fintrack.db
          AUTH_SECRET: ci-test-secret-do-not-use-in-production
          NEXTAUTH_URL: http://localhost:3000
