# OpenTelemetry Collector: recebe os sinais da aplicação (Receiver), filtra e
# agrupa (Processor) e envia para cada backend (Exporter).
#   traces -> Jaeger
#   logs   -> Elasticsearch (consultados no Kibana e no Grafana)
# As métricas da aplicação não passam por aqui: o Prometheus faz scrape direto de /api/metrics.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protege o collector de estourar memória num pico de telemetria.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Segunda barreira contra vazamento: a aplicação já não registra esses dados,
  # mas uma instrumentação automática nova poderia passar a registrar.
  attributes/remove-sensitive:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: local
        action: insert

  # O exporter do Elasticsearch já agrupa em lote; o batch fica só no pipeline de traces.
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Modo "otel" (padrão): o nome segue logs-<dataset>.otel-<namespace> para cair no
  # template nativo do Elasticsearch, que mapeia trace_id, severity_text e attributes.
  elasticsearch/logs:
    endpoints: [http://elasticsearch:9200]
    logs_index: logs-fintrack.otel-default

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    # Métricas do próprio collector (itens recebidos, exportados e descartados).
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/remove-sensitive, resource/environment, batch]
      exporters: [otlp_grpc/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment]
      exporters: [elasticsearch/logs]
